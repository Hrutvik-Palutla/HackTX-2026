name: sidequest
services:
  web:
    image: sidequest-web:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SOURCE_REVISION: ${DEPLOY_RELEASE:-local}
    init: true
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      LINK_CLI_PATH: /opt/sidequest-link/node_modules/.bin/link-cli
      LINK_AUTH_DIRECTORY: /var/lib/sidequest/link-auth
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      REQUIRE_WORKER_READY: "true"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    volumes:
      - wallet_data:/var/lib/sidequest/link-auth
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS to your domain or :80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
  worker:
    image: sidequest-worker:local
    profiles: [live]
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
      args:
        SOURCE_REVISION: ${DEPLOY_RELEASE:-local}
    init: true
    restart: unless-stopped
    env_file:
      - ${APP_ENV_FILE:-.env.production}
    environment:
      LINK_CLI_PATH: /opt/sidequest-link/node_modules/.bin/link-cli
      LINK_AUTH_DIRECTORY: /var/lib/sidequest/link-auth
      NODE_ENV: production
      CLAW_LISTENER_ENABLED: "true"
    healthcheck:
      test: ["CMD", "node", "--import=tsx", "apps/worker/src/healthcheck.ts"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 3
    volumes:
      - wallet_data:/var/lib/sidequest/link-auth
volumes:
  wallet_data:
  caddy_data:
  caddy_config:

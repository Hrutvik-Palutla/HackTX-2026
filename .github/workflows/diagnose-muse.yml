name: Diagnose production Muse requests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Probe the running worker without restarting it
        env:
          DEPLOY_HOST: ${{ secrets.VULTR_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.VULTR_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.VULTR_KNOWN_HOSTS }}
          MODEL_SECRET: ${{ secrets.SIDEQUEST_MODEL_API_KEY }}
        run: |
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$RUNNER_TEMP/diagnostic-key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          expected_hash=$(printf '%s' "$MODEL_SECRET" | sha256sum | cut -d' ' -f1)
          ssh -i "$RUNNER_TEMP/diagnostic-key" -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$DEPLOY_HOST" 'docker inspect --format "worker image revision: {{index .Config.Labels \"org.opencontainers.image.revision\"}}" sidequest-worker-1'
          scp -i "$RUNNER_TEMP/diagnostic-key" -o BatchMode=yes -o StrictHostKeyChecking=yes scripts/diagnose-muse.mjs "root@$DEPLOY_HOST:/opt/sidequest/diagnose-muse.mjs"
          ssh -i "$RUNNER_TEMP/diagnostic-key" -o BatchMode=yes -o StrictHostKeyChecking=yes "root@$DEPLOY_HOST" "docker exec -i -w /app sidequest-worker-1 node --import=tsx --input-type=module - '$expected_hash' < /opt/sidequest/diagnose-muse.mjs"
      - name: Remove temporary SSH key
        if: always()
        run: rm -f "$RUNNER_TEMP/diagnostic-key"
